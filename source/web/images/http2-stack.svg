<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="HTTP/2 protocol stack illustration">
  <defs>
    <linearGradient id="stackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a34" />
      <stop offset="100%" stop-color="#183660" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="760" height="340" rx="28" fill="#081528" stroke="#4aa5ff" stroke-opacity="0.18" stroke-width="2" />
  <text x="60" y="60" fill="#8db9ff" font-family="Inter, sans-serif" font-size="24" font-weight="700">HTTP/2 protocol stack</text>
  <g transform="translate(60, 100)">
    <rect width="680" height="64" rx="20" fill="url(#stackGradient)" opacity="0.95" />
    <text x="32" y="40" fill="#e7f2ff" font-family="Inter, sans-serif" font-size="20">Application payload</text>
  </g>
  <g transform="translate(60, 180)">
    <rect width="680" height="64" rx="20" fill="rgba(74,165,255,0.16)" />
    <text x="32" y="40" fill="#cde3ff" font-family="Inter, sans-serif" font-size="20">HTTP/2 framing & multiplexing</text>
  </g>
  <g transform="translate(60, 260)">
    <rect width="680" height="64" rx="20" fill="rgba(74,165,255,0.1)" />
    <text x="32" y="40" fill="#d9e8ff" font-family="Inter, sans-serif" font-size="20">TLS / secure transport</text>
  </g>
</svg>
