<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="HTTP/2 Rapid Reset attack diagram">
  <defs>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4aa5ff" />
      <stop offset="100%" stop-color="#82c6ff" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="760" height="340" rx="28" fill="#061021" stroke="#4aa5ff" stroke-opacity="0.12" stroke-width="2" />
  <text x="60" y="60" fill="#a8c8ff" font-family="Inter, sans-serif" font-size="24" font-weight="700">Rapid Reset attack diagram</text>
  <rect x="90" y="110" width="220" height="160" rx="24" fill="#11243d" stroke="#4aa5ff" stroke-opacity="0.22" stroke-width="2" />
  <text x="130" y="160" fill="#e7f2ff" font-family="Inter, sans-serif" font-size="20" font-weight="700">Attacker</text>
  <text x="120" y="190" fill="#9db9ff" font-family="Inter, sans-serif" font-size="16">rapidly opens streams</text>
  <text x="115" y="212" fill="#9db9ff" font-family="Inter, sans-serif" font-size="16">and sends resets</text>
  <rect x="490" y="110" width="220" height="160" rx="24" fill="#11243d" stroke="#4aa5ff" stroke-opacity="0.22" stroke-width="2" />
  <text x="540" y="160" fill="#e7f2ff" font-family="Inter, sans-serif" font-size="20" font-weight="700">Protected Server</text>
  <text x="520" y="190" fill="#9db9ff" font-family="Inter, sans-serif" font-size="16">tracks stream state</text>
  <text x="520" y="212" fill="#9db9ff" font-family="Inter, sans-serif" font-size="16">and cleans up resets</text>
  <path d="M 310 170 L 490 170" stroke="url(#arrowGradient)" stroke-width="14" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 310 210 L 490 210" stroke="url(#arrowGradient)" stroke-width="14" fill="none" marker-end="url(#arrowhead)" />
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10" fill="#4aa5ff" />
    </marker>
  </defs>
  <g transform="translate(320, 265)">
    <rect width="160" height="70" rx="18" fill="#0d1b35" stroke="#4aa5ff" stroke-opacity="0.18" stroke-width="2" />
    <text x="18" y="32" fill="#c7ddff" font-family="Inter, sans-serif" font-size="18">HTTP/2 Stream</text>
    <text x="18" y="52" fill="#8fafdc" font-family="Inter, sans-serif" font-size="14">RST_STREAM attack</text>
  </g>
</svg>
